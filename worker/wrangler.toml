name = "trakrobot-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
# ЗАМЕНИ YOUR_GITHUB_USER и имя репозитория на свои
MINIAPP_URL = "https://kunibog.github.io/tarck/"
ALLOWED_ORIGIN = "https://kunibog.github.io"
BOT_USERNAME = "trakrobot"
ADMIN_TELEGRAM_IDS = ""

# Smart Placement: Worker сам выбирает дата-центр рядом с базой (Frankfurt) — все запросы к БД становятся заметно быстрее
[placement]
mode = "smart"

[triggers]
crons = ["*/5 * * * *"]   # каждые 5 минут: напоминания, окончание PRO, завершение челленджей

# Секреты (wrangler secret put <NAME>): SUPABASE_URL, SUPABASE_SERVICE_KEY, BOT_TOKEN, WEBHOOK_SECRET, ADMIN_OWNER_ID
